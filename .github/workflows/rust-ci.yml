name: Rust CI
on:
  push:
    branches: [main, feat/rust-sso-gateway]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Verify WASM draft encryption crate
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --manifest-path frontend-crypto/Cargo.toml --target wasm32-unknown-unknown
