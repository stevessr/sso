[package]
name = "sso-crypto-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
pbkdf2 = "0.12"
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
zeroize = "1"
